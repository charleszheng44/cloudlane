<style>

*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit;color:inherit;border-radius:0}button,select{cursor:pointer}button{border:1px solid transparent;background:transparent;padding:7px 10px;min-height:32px}button:hover{background:var(--hover)}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button[aria-pressed=true],.active{color:var(--accent)!important;background:var(--selected)!important}input,select,textarea{background:var(--bg);border:1px solid var(--control);padding:7px 9px;min-width:0}input[type=range]{padding:0;height:16px;accent-color:var(--accent);border:0;cursor:pointer}input[type=checkbox]{accent-color:var(--accent)}a{color:var(--accent);text-decoration:none}svg{width:18px;height:18px;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}h1,h2,h3,p{margin:0}h1{font-size:1.65rem;font-weight:500}h2{font-size:1.15rem;font-weight:500}h3{font-size:1rem;font-weight:500}.muted,small{color:var(--secondary)}small{font-size:.86rem}.primary{background:var(--accent);color:var(--bg);border:1px solid var(--accent)}.primary:hover{filter:brightness(1.1)}.outline{border-color:var(--control)}.icon{width:32px;padding:5px;flex-shrink:0}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.stack{display:grid;gap:12px}.grow{flex:1;min-width:0}.danger{color:var(--error)}[hidden]{display:none!important}
#reviewbar{height:30px;padding:0 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);font-size:.8rem;background:var(--panel)}#reviewbar button{min-height:22px;font-size:inherit;padding:0 6px}#reviewbar .label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#app{height:calc(100dvh - 30px);min-height:420px;display:grid;grid-template-columns:168px minmax(0,1fr);grid-template-rows:max(52px,3.72rem) minmax(0,1fr) max(76px,5.43rem)}.sidebar{grid-row:1/3;border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;background:var(--panel)}.brand{padding:4px 10px 24px;font-size:1.4rem;color:var(--accent);letter-spacing:.1em}.nav{display:grid;gap:4px}.nav button{display:flex;gap:12px;align-items:center;text-align:left;min-height:38px;padding:8px 12px}.sidebar .bottom{margin-top:auto;padding-top:16px;border-top:1px solid var(--line)}.side-caption{font-size:.85rem;padding:24px 12px 8px}.sidebar .pin{text-align:left;padding:6px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}.header{grid-column:2;border-bottom:1px solid var(--line);padding:8px 16px;display:flex;align-items:center;gap:10px}.search{max-width:440px;flex:1;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line)}.search input{width:100%;border:0;background:transparent;padding:5px 0}.search kbd{white-space:nowrap;font-size:.8rem;color:var(--secondary)}.header .spacer{flex:1}#workspace{position:relative;grid-column:2;min-height:0;display:flex;overflow:hidden}#content{min-width:0;flex:1;overflow:auto;padding:24px}#content:focus{outline:0}.page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.page-head p{margin-top:4px}.section{margin:24px 0 12px}.section:first-child{margin-top:0}.quick{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line)}.quick button{display:flex;align-items:center;gap:16px;padding:18px;text-align:left}.quick button+button{border-left:1px solid var(--line)}.quick .symbol{font-size:1.65rem;color:var(--accent);width:38px;text-align:center}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,180px));gap:16px}.card{text-align:left;padding:0;min-width:0}.cover{aspect-ratio:1;display:grid;place-items:center;background:var(--selected);color:var(--accent);overflow:hidden}.cover svg{width:100%;height:100%;stroke-width:1}.card:nth-child(2n) .cover{color:var(--fg);background:var(--panel)}.card:nth-child(3n) .cover{color:var(--secondary);background:var(--bg);border:1px solid var(--line)}.card h3{margin:9px 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.table{width:100%;border-collapse:collapse;text-align:left;table-layout:fixed}.table th{font-weight:400;font-size:.85rem;color:var(--secondary);border-bottom:1px solid var(--line);padding:6px}.table td{padding:4px 6px;border-bottom:1px solid var(--hover);height:48px}.table tbody tr:hover{background:var(--hover)}.table tr.selected{background:var(--selected)}.table .num{width:35px}.table .duration{width:56px}.table .action{width:80px}.table td:last-child{white-space:nowrap}.table .album{width:26%}.track-title{padding:0;min-height:20px;text-align:left;display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status{font-size:.8rem;color:var(--error);margin-left:6px}.tabs{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 20px;border-bottom:1px solid var(--line);padding-bottom:8px}.compact-select{display:none;margin-bottom:16px;width:100%}.empty{padding:48px 16px;border:1px solid var(--line);text-align:center;display:grid;gap:14px;justify-items:center}.notice{padding:12px 14px;border:1px solid var(--line);margin-bottom:16px;display:flex;gap:12px;align-items:center}.feed{max-width:700px}.post{border-bottom:1px solid var(--line);padding:18px 0}.post p{margin:10px 0}.list-item{padding:14px 0;border-bottom:1px solid var(--line)}.setting{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:18px 0;border-bottom:1px solid var(--line)}.setting small{display:block;margin-top:3px}.setting select{max-width:45%}.detail-cover{width:112px;height:112px;flex-shrink:0}.detail-cover svg{width:100%;height:100%}.detail-head{display:flex;gap:20px;align-items:center;margin-bottom:24px}.detail-head .row{margin-top:12px;flex-wrap:wrap}.task{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}.task progress{width:100%;height:5px;accent-color:var(--accent)}
#panel{width:320px;flex-shrink:0;border-left:1px solid var(--line);padding:16px;background:var(--panel);overflow:auto}#panel header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.queue-item{display:flex;align-items:center;gap:5px;padding:9px 0;border-bottom:1px solid var(--line)}.queue-item .name{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis}.queue-item .icon{width:28px;min-height:28px}.lyric-lines{padding-top:35px;display:grid;gap:28px;font-size:1.1rem}.lyric-lines .current{color:var(--accent)}.player{grid-column:1/3;display:grid;grid-template-columns:minmax(150px,1fr) minmax(200px,1.25fr) minmax(150px,1fr);align-items:center;gap:16px;border-top:1px solid var(--line);padding:8px 16px;background:var(--panel)}.now-art{width:48px;height:48px;background:var(--selected);flex-shrink:0}.now-art svg{width:100%;height:100%}.now-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.transport{display:grid;gap:2px}.transport .row{justify-content:center}.play{border:1px solid var(--accent);color:var(--accent)}.timeline{display:flex;align-items:center;gap:8px;font-size:.8rem}.timeline input{width:100%}.player-tools{justify-content:flex-end}.volume{width:68px}.player-tools .icon{width:28px}.player .more{border-left:1px solid var(--line)}dialog{color:var(--fg);background:var(--bg);border:1px solid var(--line);padding:24px;width:min(460px,calc(100vw - 40px));max-height:85dvh;overflow:auto}dialog::backdrop{background:#0009}dialog header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}dialog label{display:grid;gap:6px}dialog textarea{min-height:90px;resize:vertical}.qr-placeholder{width:150px;height:150px;border:1px dashed var(--line);display:grid;place-items:center;text-align:center;padding:16px;margin:10px auto;color:var(--secondary)}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.menu-list{display:grid;gap:4px}.menu-list button{text-align:left;border-bottom:1px solid var(--line)}#toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);padding:10px 16px;max-width:80vw;background:var(--bg);border:1px solid var(--accent);z-index:5}.video-surface{aspect-ratio:16/9;border:1px solid var(--line);display:grid;place-items:center;background:var(--panel);margin-bottom:16px}.video-surface div{text-align:center}.video-surface p{margin-top:12px}
@media(max-width:1127px){#panel{position:absolute;right:0;top:0;bottom:0;box-shadow:-12px 0 30px #0004;z-index:2}.cards{gap:12px}.volume{display:none}.player{gap:8px;padding:8px 12px}.player-tools{gap:3px}}
@media(max-width:839px){#app{grid-template-columns:56px minmax(0,1fr)}.sidebar{padding:16px 5px}.brand{padding:4px 2px 24px;text-align:center;font-size:1.05rem;letter-spacing:0}.nav button{padding:9px 12px}.nav .nav-text,.side-caption,.pin,.sidebar .account-text{display:none}.sidebar .bottom{padding-top:10px}.sidebar .bottom button{padding:9px 12px}.header{padding:8px 10px;gap:5px}.search kbd{display:none}#content{padding:18px}.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.album{display:none}.player{grid-template-columns:minmax(120px,1fr) minmax(190px,1.4fr) auto}.player .now-art{width:36px;height:36px}.player-tools .volume-icon,.player-tools .lyrics-button{display:none}.player .artist{font-size:.8rem}.tabs{display:none}.compact-select{display:block}}
@media(max-width:759px){#panel{width:100%;box-shadow:none}.player .now-art{display:none}.player-tools{gap:0}.player #like{display:none}.page-head{align-items:flex-start}.quick button{padding:12px;gap:8px}.quick small{font-size:.8rem}.player{gap:6px}.header .account-label{display:none}}
@media(max-height:580px){#content{padding-top:16px}.section{margin-top:18px}.cards .cover{aspect-ratio:1.4}.sidebar .side-caption,.sidebar .pin{display:none}}

</style>
<div id="reviewbar"><span class="label">设计预览 · 虚构曲目 / 模拟操作</span><button id="preview-state" title="查看空、离线和错误状态">状态</button><button id="theme">浅色</button><button id="notes">设计说明</button></div>
<div id="app">
<aside class="sidebar"><div class="brand">云间</div><nav class="nav" id="navigation" aria-label="主导航"></nav><div class="side-caption">收藏歌单</div><button class="pin" data-collection="通勤时听">通勤时听</button><button class="pin" data-collection="安静下来">安静下来</button><div class="bottom"><button id="account" class="row" aria-label="账户与设置"><span data-icon="user"></span><span class="account-text" id="account-label">演示账户</span></button></div></aside>
<header class="header"><button id="back" class="icon" aria-label="返回" data-icon="back"></button><div class="search"><span data-icon="search"></span><input id="search" aria-label="搜索音乐" placeholder="搜索歌曲、歌单、艺人"><kbd>Ctrl K</kbd></div><div class="spacer"></div><button class="icon" data-page="inbox" aria-label="消息" data-icon="inbox"></button><button class="icon" data-page="settings" aria-label="设置" data-icon="settings"></button></header>
<div id="workspace"><main id="content" tabindex="-1" aria-label="音乐内容"></main><aside id="panel" hidden aria-label="播放器侧栏"></aside></div>
<footer class="player" aria-label="播放器"><div class="row"><div id="now-art" class="now-art"></div><div class="grow"><div class="now-title" id="track-title"></div><small class="artist" id="track-artist"></small></div><button id="like" class="icon" aria-label="喜欢当前歌曲" aria-pressed="false" data-icon="heart"></button></div><div class="transport"><div class="row"><button id="prev" class="icon" aria-label="上一首" data-icon="prev"></button><button id="play" class="icon play" aria-label="播放"></button><button id="next" class="icon" aria-label="下一首" data-icon="next"></button></div><div class="timeline"><span id="elapsed">00:00</span><input type="range" min="0" max="245" value="0" id="seek" aria-label="播放位置"><span id="duration">04:05</span></div></div><div class="row player-tools"><span class="volume-icon" data-icon="volume"></span><input class="volume" type="range" min="0" max="100" value="65" aria-label="音量"><button id="lyrics" class="icon lyrics-button" aria-label="歌词" aria-expanded="false" data-icon="lyrics"></button><button id="queue" class="icon" aria-label="播放队列" aria-expanded="false" data-icon="queue"></button><button id="player-more" class="icon more" aria-label="更多播放选项" data-icon="more"></button></div></footer>
</div>
<dialog id="modal" aria-labelledby="modal-title"><header><h2 id="modal-title"></h2><button id="close-modal" class="icon" aria-label="关闭" data-icon="close"></button></header><div id="modal-body"></div></dialog><div id="toast" role="status" hidden></div>
<script>
const paths={home:'M3 10 12 3 21 10M5 9v12h5v-7h4v7h5V9',discover:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18M15 9l-2 4-4 2 2-4z',library:'M4 4v16M9 4v16M14 4v16M18 4l3 16',activity:'M3 5h18v12H9l-5 4v-4H3z',user:'M16 7a4 4 0 1 0-8 0 4 4 0 0 0 8 0M4 21v-2a8 8 0 0 1 16 0v2',search:'M17 10a7 7 0 1 0-14 0 7 7 0 0 0 14 0m-2 5 6 6',back:'M15 5l-7 7 7 7',inbox:'M3 4h18v16H3zM3 13h5l2 3h4l2-3h5',settings:'M12 3v3m0 12v3M3 12h3m12 0h3M6 6l2 2m8 8 2 2M6 18l2-2m8-8 2-2M16 12a4 4 0 1 0-8 0 4 4 0 0 0 8 0',heart:'M12 21 3 12C-2 4 8 0 12 7c4-7 14-3 9 5z',prev:'M5 4v16m14-16L7 12l12 8z',next:'M19 4v16M5 4l12 8L5 20z',play:'M7 4l13 8-13 8z',pause:'M8 4v16M16 4v16',volume:'M3 9h4l5-4v14l-5-4H3zM16 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14',lyrics:'M4 5h16M4 10h12M4 15h16M4 20h9',queue:'M3 5h18M3 11h18M3 17h12m3-3 4 3-4 3',more:'M5 12h.1M12 12h.1M19 12h.1',close:'M5 5l14 14M19 5 5 19',up:'M5 15l7-7 7 7',down:'M5 9l7 7 7-7'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.more}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tracks=[{id:'1',title:'夜航',artist:'演示艺人 · 林间',album:'夜色',duration:245},{id:'2',title:'缓慢日光',artist:'演示艺人 · 远山',album:'日光集',duration:218},{id:'3',title:'城市边缘',artist:'演示艺人 · 林间',album:'城市手记',duration:236},{id:'4',title:'回声',artist:'演示艺人 · 留白',album:'回声',duration:204},{id:'5',title:'山海之间',artist:'演示艺人 · 远山',album:'旅途',duration:267,availability:'preview'},{id:'6',title:'留白',artist:'演示艺人 · 留白',album:'片刻',duration:228,availability:'unknown'}];
let page='home',libraryTab='歌单',discoverTab='歌单',inboxTab='私信',searchTab='歌曲',history=[],collectionName='通勤时听',detailKind='playlist',current='1',playing=false,signedIn=true,panel='',selected=new Set(),queue=tracks.slice(0,4).map((t,i)=>({key:i+1,id:t.id})),queueKey=4,queueIndex=0,likes=new Set(),light=false,previewState='normal',toastTimer,dialogTrigger,panelTrigger,repeatMode=0,shuffle=false;
let searchOrigin='home';let playlists=['通勤时听','安静下来','周末的路上','喜欢的现场'];
const fmt=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
function art(i=0){const shapes=['<circle cx="90" cy="90" r="56"/><circle cx="90" cy="90" r="35"/><path d="M20 90h140M90 20v140"/>','<path d="M20 130 70 45 120 130zM70 130l40-70 50 70"/>','<path d="M25 45h130M25 68h95M25 91h130M25 114h95M25 137h130"/>','<rect x="35" y="35" width="110" height="110"/><path d="m35 35 110 110M145 35 35 145"/>'];return `<svg viewBox="0 0 180 180" aria-hidden="true">${shapes[i%4]}</svg>`}
function cards(names,kind='playlist'){return '<div class="cards">'+names.map((n,i)=>`<button class="card" data-detail="${esc(n)}" data-kind="${kind}"><div class="cover">${art(i)}</div><h3>${esc(n)}</h3><small>${kind==='podcast'?'演示播客 · 每周更新':kind==='video'?'演示影像 · 04:05':kind==='artist'?'演示艺人':'演示歌单 · 6 首'}</small></button>`).join('')+'</div>'}
function rows(items=tracks){return `<table class="table"><thead><tr><th class="num">#</th><th>歌曲 / 艺人</th><th class="album">专辑</th><th class="duration">时长</th><th class="action"><span class="muted">操作</span></th></tr></thead><tbody>`+items.map((t,i)=>`<tr data-row="${t.id}" class="${selected.has(t.id)?'selected':''}"><td><input type="checkbox" aria-label="选择${esc(t.title)}" data-select="${t.id}" ${selected.has(t.id)?'checked':''}></td><td class="track"><button class="track-title" data-play="${t.id}" title="播放${esc(t.title)}">${esc(t.title)}${t.availability?`<span class="status">${t.availability==='preview'?'试听':'暂不可用'}</span>`:''}</button><small>${esc(t.artist)}</small></td><td class="album"><button class="track-title" data-detail="${esc(t.album)}" data-kind="album">${esc(t.album)}</button></td><td>${fmt(t.duration)}</td><td><button class="icon" data-add="${t.id}" aria-label="将${esc(t.title)}加入队列">＋</button><button class="icon" data-track-menu="${t.id}" aria-label="${esc(t.title)}的更多操作">${icon('more')}</button></td></tr>`).join('')+'</tbody></table>'}
const head=(title,sub='',action='')=>`<div class="page-head"><div><h1>${esc(title)}</h1>${sub?`<p class="muted">${esc(sub)}</p>`:''}</div>${action}</div>`;
const section=(title,route='')=>`<div class="row between section"><h2>${esc(title)}</h2>${route?`<button data-page="${route}">查看全部 →</button>`:''}</div>`;
function tabs(names,active,attr){return `<div class="tabs" role="group" aria-label="内容分类">`+names.map(n=>`<button data-${attr}="${esc(n)}" aria-pressed="${n===active}">${esc(n)}</button>`).join('')+`</div><select class="compact-select" aria-label="内容分类" data-tab-select="${attr}">`+names.map(n=>`<option ${n===active?'selected':''}>${esc(n)}</option>`).join('')+'</select>'}
function snap(){return {page,libraryTab,discoverTab,collectionName,detailKind,query:document.querySelector('#search').value,searchTab,scroll:document.querySelector('#content').scrollTop}}
function navigate(p){if(p==='history'){p='library';libraryTab='最近播放'}if(document.querySelector('#modal').open)closeModal();history.push(snap());page=p;document.querySelector('#search').value='';render();document.querySelector('#content').focus()}
function detail(name,kind='playlist'){history.push(snap());page='detail';collectionName=name;detailKind=kind;document.querySelector('#search').value='';render()}
function render(){document.querySelectorAll('#navigation button').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});let html='';

else if(page==='discover'){const cats=['歌单','排行榜','新歌 / 新碟','歌手','播客','有声书','MV / 视频'];html=head('发现','按喜欢的方式，找到下一首。',`<button class="outline" data-action="identify">听歌识曲</button>`)+tabs(cats,discoverTab,'discover');const names=discoverTab==='播客'?['声音日记','城市漫谈','音乐之间','每周一刻']:discoverTab==='有声书'?['山间故事','城市来信','雨夜剧场','远方的声音']:discoverTab==='MV / 视频'?['现场记录','新作首映','音乐影像','经典现场']:discoverTab==='歌手'?['林间','远山','留白','微光']:discoverTab==='排行榜'?['新歌榜','热歌榜','原创榜','飙升榜']:['独立音乐精选','器乐与留白','城市漫步','新声雷达'];html+=cards(names,discoverTab==='播客'?'podcast':discoverTab==='MV / 视频'?'video':discoverTab==='有声书'?'book':discoverTab==='歌手'?'artist':'playlist')+section(discoverTab==='播客'?'继续收听':'精选曲目')+rows(tracks.slice(0,4));}

function announce(s){const t=document.querySelector('#toast');t.textContent=s;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,2600)}
function openModal(title,html){dialogTrigger=document.activeElement;document.querySelector('#modal-title').textContent=title;document.querySelector('#modal-body').innerHTML=html;const d=document.querySelector('#modal');if(!d.open)d.showModal()}
function closeModal(){document.querySelector('#modal').close();if(dialogTrigger?.isConnected)dialogTrigger.focus()}
function syncPlayer(){const t=tracks.find(t=>t.id===current);document.querySelector('#track-title').textContent=t.title;document.querySelector('#track-artist').textContent=t.artist;document.querySelector('#now-art').innerHTML=art(Number(t.id)-1);document.querySelector('#play').innerHTML=icon(playing?'pause':'play');document.querySelector('#play').setAttribute('aria-label',playing?'暂停':'播放');document.querySelector('#like').setAttribute('aria-pressed',likes.has(current));document.querySelector('#seek').max=t.availability==='preview'?30:t.duration;document.querySelector('#duration').textContent=fmt(t.availability==='preview'?30:t.duration);if(panel==='queue'||panel==='lyrics')renderPanel()}
function playTrack(id,key){const t=tracks.find(t=>t.id===id);if(t.availability==='unknown'){announce('暂时无法播放：服务未提供可用地址');return}current=id;if(key!==undefined)queueIndex=queue.findIndex(x=>x.key===key);else{const idx=queue.findIndex(x=>x.id===id);if(idx>=0)queueIndex=idx;else{queue.push({id,key:++queueKey});queueIndex=queue.length-1}}playing=true;document.querySelector('#seek').value=0;document.querySelector('#elapsed').textContent='00:00';syncPlayer();if(t.availability==='preview')announce('演示试听：仅播放前 30 秒')}
function addQueue(id,next=false){const entry={id,key:++queueKey};if(next)queue.splice(queueIndex+1,0,entry);else queue.push(entry);if(panel==='queue')renderPanel();announce(next?'已设为下一首（演示）':'已加入队列（演示）')}

function openPanel(kind){if(panel===kind){closePanel();return}panelTrigger=document.activeElement;panel=kind;document.querySelector('#panel').hidden=false;renderPanel();document.querySelector('#queue').setAttribute('aria-expanded',kind==='queue');document.querySelector('#lyrics').setAttribute('aria-expanded',kind==='lyrics');document.querySelector('#close-panel').focus()}

function action(a,b){if(a==='close-modal')return closeModal();if(a==='login')return login();if(a==='login-confirm'){signedIn=true;closeModal();render();announce('已进入演示账户');return}if(a==='login-refresh'){announce('已刷新演示登录状态');return}if(a==='logout'){signedIn=false;likes.clear();queue=[];queueIndex=-1;selected.clear();playing=false;closePanel();syncPlayer();render();return}if(a==='new-playlist')return form('新建歌单','<label>名称<input name="name" required maxlength="40" autofocus></label><label>描述<textarea name="description"></textarea></label><label>可见范围<select name="privacy"><option>公开</option><option>仅自己</option></select></label>',d=>{playlists.push(d.get('name'));libraryTab='歌单';page='library';render();announce('演示歌单已创建')});if(a==='play-all'){queue=tracks.filter(t=>!t.availability).map(t=>({id:t.id,key:++queueKey}));playTrack(queue[0].id,queue[0].key);return}if(a==='fm'){playTrack('2');announce('私人漫游 · 演示队列');return}if(a==='comments'){closeModal();openPanel('comments');return}if(a==='collect'||a==='post-like'){b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');b.textContent=b.getAttribute('aria-pressed')==='true'?'已收藏':'收藏';return}if(a==='comment-send'){const t=document.querySelector('#comment-text');if(!t.value.trim())return t.focus();t.value='';announce('评论已在演示中提交');return}if(a==='comment-reply'){document.querySelector('#comment-text').value='回复 林间：';document.querySelector('#comment-text').focus();return}if(a==='compose')return form('分享动态','<label>内容<textarea name="text" required autofocus></textarea></label><label>附带音乐<select><option>夜航</option><option>缓慢日光</option></select></label><label>图片<input type="file" accept="image/*" multiple></label>',()=>announce('动态已在演示中发布'),'发布');if(a==='upload'||a==='episode-upload')return form(a==='upload'?'上传音乐':'上传单集','<label>音频文件<input type="file" accept="audio/*" multiple></label><label>标题<input name="title" placeholder="读取文件元数据"></label><small>设计流程：选文件 → 检查信息 → 上传任务 → 逐项结果。</small>',()=>{page='library';libraryTab='云盘';render();announce('演示上传任务已创建')},'开始上传');if(a==='folder')return form('添加本地音乐','<label>音乐目录<input name="folder" placeholder="正式应用使用系统目录选择器" required></label>',()=>announce('演示目录已加入'));if(a==='podcast-create')return form('新建播客','<label>名称<input name="title" required></label><label>简介<textarea name="intro"></textarea></label><small>此消费者端发布能力仍待验证。</small>',()=>announce('演示播客草稿已保存'),'保存草稿');if(a==='identify')return openModal('听歌识曲','<div class="stack"><p>选择音频文件，或主动开启麦克风识别。</p><input type="file" accept="audio/*" aria-label="识别音频"><button class="outline" data-action="identify-start">开始识别</button><small>设计预览不录音；原生指纹与服务接口仍待验证。</small></div>');if(a==='together')return form('一起听','<label>房间邀请链接<input name="room" placeholder="粘贴 NetEase 房间邀请链接"></label><div class="row"><button type="button" data-action="room-create" class="outline">创建房间</button></div><small>加入后显示参与者、同步状态、房主控制与离开操作。</small>',()=>announce('已模拟加入房间'),'加入');if(a==='room-create'){openModal('一起听 · 演示房间','<div class="stack"><p>演示账户 · 房主</p><small>等待好友加入 · 同步已暂停</small><button class="outline" data-action="share-room">复制邀请链接</button><button class="outline" data-action="close-modal">离开房间</button></div>');return}if(a==='detail-more')return openModal('作品操作','<div class="menu-list"><button data-action="new-playlist">编辑歌单</button><button data-action="share-link">复制分享链接</button><button data-action="download-collection">下载可用曲目</button></div>');if(a==='sleep')return form('睡眠定时','<label>停止播放时间<select name="timer"><option>关闭</option><option>15 分钟后</option><option>30 分钟后</option><option>当前曲目结束</option></select></label>',d=>announce('演示定时：'+d.get('timer')));if(a==='mini-player')return openModal('迷你播放器',`<div class="stack"><h3>${esc(tracks.find(t=>t.id===current).title)}</h3><div class="row"><button data-action="mini-prev">上一首</button><button data-action="mini-play">播放 / 暂停</button><button data-action="mini-next">下一首</button></div><small>正式应用使用独立的小型 Wayland 窗口。</small></div>`);if(a==='mini-play'){playing=!playing;syncPlayer( document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.page)navigate(d.page);else if(d.collection)detail(d.collection);else if(d.detail)detail(d.detail,d.kind);else if(d.play)playTrack(d.play);else if(d.add)addQueue(d.add);else if(d.trackMenu)trackMenu(d.trackMenu);else if(d.action)action(d.action,b);else if(d.library){libraryTab=d.library;render()}else if(d.discover){discoverTab=d.discover;render()}else if(d.inbox){inboxTab=d.inbox;render()}else if(d.search){searchTab=d.search;renderSearch()}else if(d.message)form('与 '+d.message+' 的会话','<p>演示消息：分享给你一首歌</p><label>消息<textarea name="text" required autofocus></textarea></label>',()=>announce('私信已在演示中发送'),'发送');else if(d.queuePlay)playTrack(queue.find(x=>x.key===Number(d.queuePlay)).id,Number(d.queuePlay));else if(d.move){let i=queue.findIndex(x=>x.key===Number(d.move));const key=queue[queueIndex]?.key;if(i>0)[queue[i-1],queue[i]]=[queue[i],queue[i-1]];queueIndex=queue.findIndex(x=>x.key===key);renderPanel()}else if(d.remove){const key=queue[queueIndex]?.key;queue=queue.filter(x=>x.key!==Number(d.remove));queueIndex=queue.findIndex(x=>x.key===key);renderPanel()}else if(d.lyricSeek){document.querySelector('#seek').value=d.lyricSeek;document.querySelector('#seek').dispatchEvent(new Event('input'))}else if(d.trackAction){const id=d.id;closeModal();if(d.trackAction==='next')addQueue(id,true);if(d.trackAction==='queue')addQueue(id);if(d.trackAction==='like'){likes.has(id)?likes.delete(id):likes.add(id);syncPlayer()}if(d.trackAction==='comments')showComments('song:'+id,tracks.find(t=>t.id===id).title);if(d.trackAction==='playlist')form('加入歌单','<label>歌单<select>'+playlists.map(n=>`<option>${esc(n)}</option>`).join('')+'</select></label>',()=>announce('已加入演示歌单'));if(d.trackAction==='download'){libraryTab='下载';navigate('library')}if(d.trackAction==='share')announce('演示中不复制虚构的音乐链接')}});
document.addEventListener('change',e=>{if(e.target.dataset.tabSelect){const v=e.target.value;if(e.target.dataset.tabSelect==='library')libraryTab=v;else if(e.target.dataset.tabSelect==='discover')discoverTab=v;else if(e.target.dataset.tabSelect==='inbox')inboxTab=v;else if(e.target.dataset.tabSelect==='search'){searchTab=v;renderSearch();return}render()}if(e.target.dataset.select){const id=e.target.dataset.select;e.target.checked?selected.add(id):selected.delete(id);e.target.closest('tr').classList.toggle('selected',e.target.checked)}});
document.querySelector('#navigation').innerHTML=[['home','首页'],['discover','发现'],['library','我的音乐'],['activity','动态']].map(([p,n])=>`<button data-page="${p}" title="${n}" aria-label="${n}">${icon(p)}<span class="nav-text">${n}</span></button>`).join('');document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
document.querySelector('#play').onclick=()=>{playing=!playing;syncPlayer()};document.querySelector('#next').onclick=()=>{if(queue.length){queueIndex=(queueIndex+1)%queue.length;playTrack(queue[queueIndex].id,queue[queueIndex].key)}};document.querySelector('#prev').onclick=()=>{if(queue.length){queueIndex=(queueIndex-1+queue.length)%queue.length;playTrack(queue[queueIndex].id,queue[queueIndex].key)}};document.querySelector('#like').onclick=()=>{likes.has(current)?likes.delete(current):likes.add(current);syncPlayer();if(page==='library'&&libraryTab==='我喜欢')render()};document.querySelector('#seek').oninput=e=>document.querySelector('#elapsed').textContent=fmt(Number(e.target.value));document.querySelector('#queue').onclick=()=>openPanel('queue');document.querySelector('#lyrics').onclick=()=>openPanel('lyrics');
document.querySelector('#back').onclick=()=>{const old=history.pop();if(old){page=old.page;libraryTab=old.libraryTab;discoverTab=old.discoverTab;collectionName=old.collectionName;detailKind=old.detailKind;searchTab=old.searchTab||'歌曲';document.querySelector('#search').value=old.query||'';if(old.query)renderSearch();else render();document.querySelector('#content').scrollTop=old.scroll}};
document.querySelector('#player-more').onclick=()=>{openModal('播放选项',`<div class="menu-list"><button id="shuffle-mode" aria-pressed="${shuffle}">随机播放：${shuffle?'开':'关'}</button><button id="repeat-mode">循环：${['关闭','列表','单曲'][repeatMode]}</button><button data-action="together">一起听</button><button id="overflow-lyrics">歌词</button><button data-action="sleep">睡眠定时</button><button data-action="mini-player">迷你播放器</button><button data-page="settings" id="overflow-settings">音质与输出设备</button></div>`);document.querySelector('#shuffle-mode').onclick=e=>{shuffle=!shuffle;e.currentTarget.setAttribute('aria-pressed',shuffle);e.currentTarget.textContent='随机播放：'+(shuffle?'开':'关')};document.querySelector('#repeat-mode').onclick=e=>{repeatMode=(repeatMode+1)%3;e.currentTarget.textContent='循环：'+['关闭','列表','单曲'][repeatMode]};document.querySelector('#overflow-lyrics').onclick=()=>{closeModal();openPanel('lyrics')};document.querySelector('#overflow-settings').addEventListener('click',closeModal)};

function renderSearch(){const q=document.querySelector('#search').value.trim();if(!q){if(page==='search')page=searchOrigin||'home';return render()}if(page!=='search'){searchOrigin=page;page='search';}const found=tracks.filter(t=>(t.title+t.artist+t.album).includes(q));let result=found.length?rows(found):'<div class="empty"><p>没有找到匹配的演示内容</p></div>';if(searchTab!=='歌曲'){const names=searchTab==='歌单'?playlists.filter(n=>n.includes(q)):searchTab==='艺人'?[...new Set(found.map(t=>t.artist.replace('演示艺人 · ','')))]:[...new Set(found.map(t=>t.album))];result=names.length?cards(names,searchTab==='艺人'?'artist':searchTab==='专辑'?'album':'playlist'):'<div class="empty"><p>没有找到匹配的演示内容</p></div>'}document.querySelector('#content').innerHTML=head('搜索结果',q)+tabs(['歌曲','歌单','艺人','专辑','用户','播客','视频','歌词','有声书'],searchTab,'search')+result}document.querySelector('#search').oninput=renderSearch;

document.addEventListener('keydown',e=>{const tag=document.activeElement.tagName;const editable=['INPUT','TEXTAREA','SELECT'].includes(tag)||document.activeElement.isContentEditable;if(!document.querySelector('#modal').open&&((e.key==='/'&&!editable)||(e.ctrlKey&&e.key.toLowerCase()==='k'))){e.preventDefault();document.querySelector('#search').focus()}if(e.key===' '&&!editable&&!['BUTTON','A','SUMMARY'].includes(tag)&&!document.querySelector('#modal').open){e.preventDefault();playing=!playing;syncPlayer()}if(e.key==='Escape'&&!document.querySelector('#modal').open&&panel)closePanel();if(e.altKey&&e.key==='ArrowLeft'&&!document.querySelector('#modal').open){e.preventDefault();document.querySelector('#back').click()}});
